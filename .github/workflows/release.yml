name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing, and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/perses/perses/cmd/percli@v0.55.1-0.20261105174710-c6e60cd5a5db
      # percli runs `cue mod tidy` when it builds the plugin archive.
      - run: go install cuelang.org/go/cmd/cue@v0.16.1
      - name: The tag is the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm test
      - run: percli plugin test-schemas
      - run: npm run build
      - run: percli plugin build
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      # By OIDC, as this repository's trusted publisher: no token is stored.
      # A version already on npm is skipped, as 0.1.0 is: npm attaches a
      # trusted publisher only to a package that exists, so that one was
      # published by hand.
      - name: Publish to npm
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
          else
            npm publish ./dist --provenance
          fi
      - run: npm pack ./dist
      - name: Release notes from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The annotated tag's message (git tag -a vX.Y.Z --cleanup=whitespace
          # -F notes.md), else GitHub's generated notes; never none.
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes.md"
          git fetch -q --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          : > "${notes}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ]; then
            git cat-file tag "refs/tags/${TAG}" | sed '1,/^$/d; /^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d' > "${notes}"
          fi
          if ! awk -v t="${TAG}" 'NF && $0 != t { f = 1 } END { exit !f }' "${notes}"; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" -q .body > "${notes}"
            awk 'NF && !/Full Changelog/ { f = 1 } END { exit !f }' "${notes}" || {
              echo "::error::${TAG} has no release notes: tag it with git tag -a and the notes as its message"; exit 1; }
          fi
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "${RUNNER_TEMP}/notes.md" *.tar.gz *.tgz
        env:
          GH_TOKEN: ${{ github.token }}

  # The README's sample image, drawn once the release exists.
  preview:
    needs: release
    uses: ./.github/workflows/preview.yml
    with:
      tag: ${{ github.ref_name }}
