name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing, and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/perses/perses/cmd/percli@v0.55.1-0.20261105174710-c6e60cd5a5db
      - name: The tag is the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm test
      - run: percli plugin test-schemas
      - run: npm run build
      - run: percli plugin build
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm publish ./dist --provenance
        env:
          # A package's first version needs a token: npm attaches a trusted
          # publisher only to a package that exists. Once it is attached on
          # npmjs.com, delete the NPM_TOKEN secret and this publishes by OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm pack ./dist
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes *.tar.gz *.tgz
        env:
          GH_TOKEN: ${{ github.token }}
